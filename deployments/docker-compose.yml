version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: exportuser
      POSTGRES_PASSWORD: exportpass
      POSTGRES_DB: exportdb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    
  localstack:
    image: localstack/localstack
    environment:
      SERVICES: s3,lambda
    ports:
      - "4566:4566"